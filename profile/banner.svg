<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-labelledby="t d">
  <title id="t">RiskVoid</title>
  <desc id="d">Pentesting for AI systems: AI agents, LLM apps, automations, and the web apps and APIs around them.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <radialGradient id="glow" cx="0.2" cy="0.1" r="0.75">
      <stop offset="0" stop-color="#47B6FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#47B6FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#47B6FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#47B6FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#47B6FF" stop-opacity="0"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect width="1280" height="380" rx="16" fill="#14161b"/>
  <rect width="1280" height="380" rx="16" fill="url(#grid)"/>
  <rect width="1280" height="380" rx="16" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1279" height="379" rx="16" fill="none" stroke="#2b2f37"/>
  <rect x="0" y="0" width="1280" height="2" fill="url(#fade)"/>

  <!-- brand -->
  <g transform="translate(64 58) scale(0.104)">
    <path fill="#47B6FF" d="M10 70 L480 70 L370 263 L318 263 L435 437 L365 437 L212 207 L340 207 L388 120 L110 120 L287 383 L252 440 Z"/>
  </g>
  <text x="124" y="91" class="mono" font-size="15" letter-spacing="3" fill="#9aa0aa">RISKVOID · AI &amp; APPSEC</text>

  <text x="62" y="186" class="sans" font-size="48" font-weight="700" letter-spacing="-1.5" fill="#f2f4f7">Pentesting for AI systems</text>
  <text x="64" y="230" class="sans" font-size="18" fill="#b9bec7">AI agents, LLM apps, automations, and the web apps and APIs around them.</text>

  <!-- chips -->
  <g class="mono" font-size="13" fill="#d6dae0">
    <g transform="translate(64 300)">
      <rect width="120" height="32" rx="16" fill="#1c1f26" stroke="#30353e"/>
      <circle cx="18" cy="16" r="4" fill="#e04b52"/><text x="30" y="21">pentests</text>
    </g>
    <g transform="translate(194 300)">
      <rect width="124" height="32" rx="16" fill="#1c1f26" stroke="#30353e"/>
      <circle cx="18" cy="16" r="4" fill="#47B6FF"/><text x="30" y="21">AI agents</text>
    </g>
    <g transform="translate(328 300)">
      <rect width="112" height="32" rx="16" fill="#1c1f26" stroke="#30353e"/>
      <circle cx="18" cy="16" r="4" fill="#47B6FF"/><text x="30" y="21">LLM apps</text>
    </g>
    <g transform="translate(450 300)">
      <rect width="136" height="32" rx="16" fill="#1c1f26" stroke="#30353e"/>
      <circle cx="18" cy="16" r="4" fill="#e6bd5c"/><text x="30" y="21">automations</text>
    </g>
    <g transform="translate(596 300)">
      <rect width="120" height="32" rx="16" fill="#1c1f26" stroke="#30353e"/>
      <circle cx="18" cy="16" r="4" fill="#5cc28c"/><text x="30" y="21">web &amp; API</text>
    </g>
  </g>

  <!-- terminal: the open source kit at work -->
  <g transform="translate(790 64)" class="mono" font-size="13">
    <rect width="426" height="252" rx="10" fill="#0f1115" stroke="#2b2f37"/>
    <rect width="426" height="34" rx="10" fill="#1a1d23"/>
    <rect y="24" width="426" height="10" fill="#1a1d23"/>
    <circle cx="20" cy="17" r="5" fill="#e04b52" fill-opacity="0.8"/>
    <circle cx="38" cy="17" r="5" fill="#e6bd5c" fill-opacity="0.8"/>
    <circle cx="56" cy="17" r="5" fill="#5cc28c" fill-opacity="0.8"/>
    <text x="213" y="22" text-anchor="middle" fill="#6b717c" font-size="12">security-agent-kit</text>

    <text x="20" y="66" fill="#9aa0aa"><tspan fill="#5cc28c">$</tspan> ./rvkit quickstart</text>
    <text x="20" y="96" fill="#9aa0aa">scope     <tspan fill="#d6dae0">juice-shop.lab</tspan> <tspan fill="#5cc28c">locked</tspan></text>
    <text x="20" y="120" fill="#9aa0aa">recon     <tspan fill="#d6dae0">14 endpoints, 2 forms</tspan></text>
    <text x="20" y="144" fill="#9aa0aa">approval  <tspan fill="#e6bd5c">sqlmap on /rest/user/login</tspan></text>
    <text x="20" y="168" fill="#9aa0aa">finding   <tspan fill="#e04b52">SQL injection</tspan> <tspan fill="#d6dae0">high</tspan></text>
    <text x="20" y="192" fill="#9aa0aa">evidence  <tspan fill="#d6dae0">sha256 3f9a…c21e</tspan></text>
    <text x="20" y="216" fill="#9aa0aa">report    <tspan fill="#47B6FF">client-report.pdf</tspan></text>
    <rect x="20" y="228" width="8" height="14" fill="#47B6FF" fill-opacity="0.8"/>
  </g>
</svg>
